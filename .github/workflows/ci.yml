name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-test:
    runs-on: ubuntu-latest
    env:
      # 覆盖 .cargo/config.toml 的本机绝对路径（网络盘优化仅限本机）
      CARGO_TARGET_DIR: /tmp/cargo-target-ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows-test:
    # windows-x64：cargo test + 双产物构建 + node 套件
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: C:\\cargo-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      # 包内产物（本地 mingw 交叉编译、git 入库）直接验证：CI 绿 = 本地产物可发
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jixo/opendweb-client-sdk test
      - run: pnpm --filter opendweb test
      - run: pnpm --filter @jixo/opendweb-server-binary test

  node-build:
    # napi 原生模块与 example 只在 macos-arm64 上验证
    runs-on: macos-14
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /tmp/cargo-target-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run test
