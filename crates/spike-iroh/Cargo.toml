[package]
name = "spike-iroh"
description = "Spike crate validating iroh 1.x APIs before fabric session implementation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "spike-iroh"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
iroh = { workspace = true }
# `server` feature is required to run a self-hosted iroh-relay Server.
iroh-relay = { workspace = true, features = ["server"] }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
# Stream extensions for consuming Connection::path_events() / address_lookup resolve streams.
n0-future = "0.3"
