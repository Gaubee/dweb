[package]
name = "dweb-fabric"
description = "dweb application-level fabric kernel: identity, signed roster, iroh sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
iroh = { workspace = true }
iroh-base = { workspace = true }
iroh-relay = { workspace = true }
# RelayTlsTrust::CustomPem 的 PEM 解析与 CertificateDer 构造（HB 5.1；
# 与 iroh-relay 内部同源同版本，已在依赖树中，不引入新编译单元）
rustls-pki-types = "1"
# Content addressing (fact_id) and file checksums.
blake3 = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# Debug (non-canonical) JSON projection of facts; canonical bytes are hand-written.
serde_json = { workspace = true }
hex = "0.4"
argon2 = { workspace = true }
zeroize = { workspace = true }
chacha20poly1305 = { workspace = true }
fs4 = "0.13"
n0-future = "0.3"

[dev-dependencies]
serde = { workspace = true }
tempfile = "3"
# relay watcher 集成测试起真实 iroh relay server（唯一锁影响：iroh 条目具体化 "axum" 一行）
iroh = { workspace = true, features = ["test-utils"] }
