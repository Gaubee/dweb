[package]
name = "dweb-fabric"
description = "dweb application-level fabric kernel: identity, signed roster, iroh sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
iroh = { workspace = true }
iroh-base = { workspace = true }
ed25519-dalek = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
base64 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# Debug (non-canonical) JSON projection of facts; canonical bytes are hand-written.
serde_json = { workspace = true }
# OS entropy for key generation (already in the workspace graph via rand).
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
