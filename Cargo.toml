[workspace]
resolver = "2"
members = [
    "crates/dweb-fabric",
    "crates/dweb-server",
    "crates/spike-iroh",
    "packages/client-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Gaubee/dweb"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
iroh = "=1.1.0"
iroh-relay = { version = "=1.1.0", features = ["server"] }
iroh-base = "=1.1.0"
blake3 = "1"
argon2 = "0.5"
zeroize = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
uuid = { version = "1", features = ["v7"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
napi = { version = "3", default-features = false, features = ["napi4", "async"] }
napi-derive = "3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
