[workspace]
resolver = "2"
members = [
    "crates/dweb-fabric",
    "crates/dweb-server",
    "crates/spike-iroh",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Gaubee/dweb"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
iroh = "1"
iroh-relay = "1"
iroh-base = "1"
ed25519-dalek = "2"
uuid = { version = "1", features = ["v7"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
lto = "thin"
strip = true
